<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="monospace">
  <rect width="920" height="660" fill="#0f172a" rx="12"/>
  <text x="460" y="30" fill="#f1f5f9" font-size="16" font-weight="bold" text-anchor="middle">The Galaxy — Phase 1 Final Topology</text>
  <text x="460" y="48" fill="#64748b" font-size="10" text-anchor="middle">dedicated WAN/LAN NICs · 6-VLAN segmentation · VLAN 99 eliminated</text>

  <!-- Internet -->
  <ellipse cx="460" cy="82" rx="54" ry="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="460" y="79" fill="#94a3b8" font-size="11" text-anchor="middle">Internet</text>
  <text x="460" y="92" fill="#475569" font-size="8" text-anchor="middle">ISP — 1G fiber</text>
  <line x1="460" y1="101" x2="460" y2="116" stroke="#475569" stroke-width="1.5"/>

  <!-- senate -->
  <rect x="300" y="116" width="320" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="136" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">senate — house router (Asus GT-AX11000)</text>
  <text x="460" y="152" fill="#475569" font-size="8" text-anchor="middle">192.168.1.1 · static route 10.0.0.0/16 → 192.168.1.100</text>
  <line x1="460" y1="166" x2="460" y2="182" stroke="#475569" stroke-width="1.5"/>
  <text x="466" y="178" fill="#475569" font-size="7.5">WAN (enp0s31f6 → vmbr0)</text>

  <!-- executor container -->
  <rect x="60" y="182" width="800" height="268" rx="10" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="78" y="200" fill="#3b82f6" font-size="10" font-weight="bold">executor — Proxmox VE 9.1.1</text>
  <text x="842" y="200" fill="#1d4ed8" font-size="8" text-anchor="end">i7-7700T · 64GB DDR4 · 512GB NVMe · 2× NICs (2.5G)</text>

  <!-- tarkin -->
  <rect x="80" y="214" width="250" height="150" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="205" y="234" fill="#f97316" font-size="11" font-weight="bold" text-anchor="middle">tarkin (VM 100)</text>
  <text x="205" y="248" fill="#64748b" font-size="8" text-anchor="middle">OPNsense 26.1.6 · Kea DHCPv4 · FW</text>
  <line x1="90" y1="255" x2="320" y2="255" stroke="#374151" stroke-width="0.5"/>
  <text x="96" y="270" fill="#94a3b8" font-size="8">VLAN 10 mgmt    10.0.10.1</text>
  <text x="96" y="284" fill="#94a3b8" font-size="8">VLAN 20 trusted 10.0.20.1</text>
  <text x="96" y="298" fill="#94a3b8" font-size="8">VLAN 30 servers 10.0.30.1</text>
  <text x="96" y="312" fill="#94a3b8" font-size="8">VLAN 40 family  10.0.40.1</text>
  <text x="96" y="326" fill="#94a3b8" font-size="8">VLAN 50 iot     10.0.50.1</text>
  <text x="96" y="340" fill="#94a3b8" font-size="8">VLAN 60 seclab  10.0.60.1</text>
  <text x="205" y="357" fill="#475569" font-size="7.5" text-anchor="middle">WAN 192.168.1.100 · LAN trunk em0</text>

  <!-- host networking panel -->
  <rect x="360" y="214" width="480" height="150" rx="8" fill="#0b1626" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="376" y="234" fill="#22d3ee" font-size="9" font-weight="bold">HOST NETWORKING — dedicated NICs (ADR 0002)</text>
  <text x="376" y="256" fill="#94a3b8" font-size="8">enp0s31f6 → vmbr0 — WAN bridge, direct to senate (192.168.1.225)</text>
  <text x="376" y="272" fill="#94a3b8" font-size="8">enp1s0 → vmbr1 — VLAN-aware LAN trunk (bridge-vids 2-4094)</text>
  <text x="376" y="288" fill="#94a3b8" font-size="8">vmbr1.10 — host mgmt 10.0.10.10 (+ route 10.0.0.0/16 via 10.0.10.1)</text>
  <text x="376" y="304" fill="#64748b" font-size="8">Kea DHCPv4 on all six subnets · dnsmasq disabled (port 67)</text>
  <text x="376" y="320" fill="#64748b" font-size="8">Router-on-a-stick + VLAN 99 transit removed 2026-06-07</text>
  <text x="376" y="344" fill="#475569" font-size="7.5">WAN and LAN physically separated — switch sits fully behind the firewall</text>

  <text x="78" y="434" fill="#475569" font-size="8">Phase 1 scope: network core only — service VMs arrive in Phase 2</text>

  <!-- trunk to switch -->
  <line x1="460" y1="450" x2="460" y2="478" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="466" y="468" fill="#3b82f6" font-size="7.5">LAN trunk (enp1s0 → vmbr1 · 802.1Q)</text>

  <!-- death-star -->
  <rect x="300" y="478" width="320" height="54" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="460" y="498" fill="#c4b5fd" font-size="11" font-weight="bold" text-anchor="middle">death-star — 2.5G managed switch</text>
  <text x="460" y="514" fill="#475569" font-size="8" text-anchor="middle">ZX-SWTGW215AS · 10.0.10.2 · P1 = trunk, all VLANs tagged</text>
  <line x1="460" y1="524" x2="460" y2="532" stroke="#8b5cf6" stroke-width="0" />

  <!-- falcon -->
  <line x1="380" y1="532" x2="300" y2="562" stroke="#475569" stroke-width="1"/>
  <text x="290" y="552" fill="#475569" font-size="7.5" text-anchor="end">P2 · access VLAN 20</text>
  <rect x="150" y="562" width="220" height="48" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="260" y="581" fill="#6ee7b7" font-size="9" font-weight="bold" text-anchor="middle">falcon — workstation</text>
  <text x="260" y="596" fill="#475569" font-size="8" text-anchor="middle">10.0.20.10 · VLAN 20 (access)</text>

  <!-- holonet -->
  <line x1="540" y1="532" x2="620" y2="562" stroke="#475569" stroke-width="1"/>
  <text x="630" y="552" fill="#475569" font-size="7.5">P3 · trunk VLANs 20/40/50</text>
  <rect x="550" y="562" width="240" height="48" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="670" y="581" fill="#fcd34d" font-size="9" font-weight="bold" text-anchor="middle">holonet — WiFi AP (Multi-SSID)</text>
  <text x="670" y="596" fill="#475569" font-size="8" text-anchor="middle">HoloNet 20 · OuterRim 40 · MosEisley 50 · 10.0.20.3</text>

  <text x="460" y="640" fill="#334155" font-size="8" text-anchor="middle">Phase 1 complete 2026-06 — see phases/phase-1-core-network.md</text>
</svg>
